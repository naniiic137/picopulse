name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web - test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  firmware:
    name: Firmware - syntax check and host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The firmware imports MicroPython-only modules, so CPython can only
      # check its syntax; the unit tests run it against stubbed hardware.
      - run: python -m py_compile firmware/main.py firmware/examples/mqtt_picow.py
      - run: python -m unittest discover -s firmware/tests -v
      - name: Validate Wokwi diagram.json
        run: python -c "import json; d = json.load(open('firmware/diagram.json')); assert d['version'] == 1 and d['parts']"
